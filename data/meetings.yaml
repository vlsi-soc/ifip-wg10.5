# Meetings page. Add a new meeting by appending an entry to `meetings:` below
# (any year - entries are grouped and sorted by `date` automatically at build time).
#
# Fields per entry:
#   date          required, YYYY-MM-DD (use day 01 if the exact day is unknown)
#   location      free text shown before "co-located with ..." (the date is
#                 appended automatically - do not repeat it in location/text)
#   event         optional {name, url} of the co-located conference (url may
#                 be null if there's no link, e.g. an old/defunct conference)
#   text          optional extra free text (a date RANGE, "Informal meeting",
#                 a mismatched/virtual-meeting date, etc.) - not a plain
#                 restatement of `date`
#   minutes_url   optional path to the minutes file (omit if not available yet)
#   minutes_label default "see Minutes" if omitted
#   links         optional list of extra {label, url} downloads (slides, etc.)
#   note          optional short note shown in italics (e.g. "Minutes not yet published")

